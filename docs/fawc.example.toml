# Copy to ~/.config/fawc/fawc.toml. Every key is optional; changes apply while FAWC runs
# (a file that does not parse is reported in the log and ignored).

[appearance]
accent = "#4aa8ee"     # colour of the glass, #rrggbb
transparency = 0.38    # tint strength of window frames, 0 (clear) .. 1
blur = 3               # blur levels 1..6: softer but slower
gloss = 0.8            # gloss band on the title bar, 0 .. 1
animations = true      # windows fade and grow in when they open
cursor_theme = ""      # an XCursor theme (a folder with cursors/ in ~/.icons, /usr/share/icons ...); empty = $XCURSOR_THEME
cursor_size = 0        # pixels at scale 1; 0 = $XCURSOR_SIZE, else 24

[input]
keyboard_layout = ""   # xkb layout, e.g. "de"; empty = system default
repeat_rate = 25
repeat_delay = 600

[shell]
terminal = "foot"
launcher = ""          # what the start orb runs when no applications are found
panel = true           # start the task bar with the session
autostart = []         # e.g. ["nm-applet", "foot"]

[session]
idle_lock_seconds = 0  # lock after this many idle seconds; 0 = never

# One block per monitor, named like the connector (see the log line "monitor DP-1 (...)").
# Without a block a monitor uses its preferred mode at scale 1, placed to the right of the others.
[outputs."DP-1"]
scale = 1.5            # physical pixels per logical pixel: 1, 1.25, 1.5, 2 ...
mode = "2560x1440@144" # empty = the monitor's preferred mode
x = 0                  # position in the shared space (in logical pixels); x and y go together
y = 0
enabled = true

[outputs."HDMI-A-1"]
scale = 1.0
x = 1707               # 2560 / 1.5, right of DP-1
y = 0
