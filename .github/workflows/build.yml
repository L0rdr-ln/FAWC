name: build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libseat-dev libinput-dev libgbm-dev \
            libegl-dev libgles-dev libxkbcommon-dev libdrm-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dri mesa-utils dbus libglib2.0-bin libgtk-4-dev xvfb libasound2-dev xwayland xterm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      # llvmpipe: the glass shaders are rendered on the CPU and checked pixel by pixel
      - run: cargo test --locked
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Settings app (GTK4)
        run: |
          cargo build --locked -p fde-settings
          cargo test --locked -p fde-settings
          # it opens, draws and closes by itself on a virtual display
          xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo FDE_CONFIG=$RUNNER_TEMP/fde.toml \
            ./target/debug/fde-settings --quit-after 1500
      - name: Music player
        run: |
          cargo build --locked -p fde-music
          cargo test --locked -p fde-music
      - name: Render the demo scene
        run: |
          cargo run --locked -- glass-demo glass-demo.png
          test -s glass-demo.png
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: glass-demo
          path: glass-demo.png
