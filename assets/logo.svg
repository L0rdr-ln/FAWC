<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>FDE logo: a glass orb over a sky and a hill</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#bfeaff"/><stop offset="1" stop-color="#2a9fe0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdc4a"/><stop offset="1" stop-color="#2e9a2e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset=".86" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </radialGradient>
    <clipPath id="orb"><circle cx="128" cy="128" r="112"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <ellipse cx="128" cy="240" rx="80" ry="8" fill="#0a3a60" opacity=".25" filter="url(#soft)"/>
  <g clip-path="url(#orb)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <ellipse cx="70" cy="90" rx="40" ry="14" fill="#fff" opacity=".85"/>
    <ellipse cx="96" cy="80" rx="30" ry="14" fill="#fff" opacity=".85"/>
    <ellipse cx="190" cy="120" rx="28" ry="10" fill="#fff" opacity=".7"/>
    <path d="M-10 200 Q70 130 150 190 T280 170 V270 H-10 Z" fill="url(#hill)"/>
    <path d="M-10 224 Q90 180 190 222 T280 210 V270 H-10 Z" fill="#2e9a2e" opacity=".55"/>
  </g>
  <circle cx="128" cy="128" r="112" fill="url(#rim)"/>
  <circle cx="128" cy="128" r="111" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3"/>
  <path d="M40 112 A104 104 0 0 1 216 112 Q128 150 40 112 Z" fill="url(#gloss)"/>
</svg>
