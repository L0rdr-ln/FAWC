<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <title>Aero-chan, the FDE OS-tan</title>
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd0ff"/><stop offset="1" stop-color="#2a8fdc"/>
    </linearGradient>
    <linearGradient id="hairhi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0e6"/><stop offset="1" stop-color="#ffd9c4"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c6fbf"/><stop offset=".6" stop-color="#3fb4f0"/><stop offset="1" stop-color="#9be8ff"/>
    </linearGradient>
    <radialGradient id="orbg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#e9ffc8"/><stop offset=".5" stop-color="#7fdc3a"/><stop offset="1" stop-color="#2e9a2e"/>
    </radialGradient>
    <radialGradient id="orbb" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#f0fbff"/><stop offset=".5" stop-color="#5cc0f5"/><stop offset="1" stop-color="#1f7fd0"/>
    </radialGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be85a"/><stop offset="1" stop-color="#2e9a2e"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <ellipse cx="180" cy="462" rx="96" ry="10" fill="#0a3a60" opacity=".25" filter="url(#soft)"/>

  <!-- back hair -->
  <path d="M62 170 C40 80 110 24 180 24 C250 24 320 80 298 170 C310 250 300 300 284 322 L252 300 L108 300 L76 322 C60 300 50 250 62 170 Z" fill="url(#hair)"/>

  <!-- legs and shoes -->
  <rect x="146" y="388" width="26" height="46" rx="12" fill="url(#skin)"/>
  <rect x="188" y="388" width="26" height="46" rx="12" fill="url(#skin)"/>
  <path d="M136 436 C136 424 176 424 178 436 C180 452 172 456 156 456 C140 456 134 450 136 436 Z" fill="url(#shoe)"/>
  <path d="M182 436 C184 424 224 424 224 436 C226 450 220 456 204 456 C188 456 180 452 182 436 Z" fill="url(#shoe)"/>

  <!-- arms -->
  <path d="M120 316 C92 336 84 362 92 380" fill="none" stroke="url(#skin)" stroke-width="20" stroke-linecap="round"/>
  <path d="M240 316 C270 326 286 306 282 280" fill="none" stroke="url(#skin)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="94" cy="384" r="12" fill="url(#skin)"/>
  <circle cx="282" cy="276" r="12" fill="url(#skin)"/>

  <!-- dress -->
  <path d="M132 300 L228 300 L252 400 C220 414 140 414 108 400 Z" fill="url(#dress)" stroke="#8fd0ff" stroke-width="2"/>
  <path d="M120 392 C160 404 200 404 240 392" fill="none" stroke="#2e9a2e" stroke-width="5" stroke-linecap="round"/>
  <!-- collar and the start orb -->
  <path d="M142 296 L180 330 L218 296 Z" fill="#7fd0ff" stroke="#fff" stroke-width="2"/>
  <circle cx="180" cy="346" r="15" fill="url(#orbg)" stroke="#fff" stroke-width="2.5"/>
  <ellipse cx="175" cy="339" rx="8" ry="4.5" fill="#fff" opacity=".8"/>
  <path d="M168 360 L192 360" stroke="#7fd0ff" stroke-width="3" stroke-linecap="round"/>

  <!-- neck, head -->
  <rect x="164" y="270" width="32" height="40" rx="14" fill="url(#skin)"/>
  <ellipse cx="180" cy="188" rx="106" ry="98" fill="url(#skin)"/>

  <!-- fringe -->
  <path d="M72 176 C60 80 130 44 180 44 C240 44 304 84 288 176 C270 150 250 118 232 108 C226 134 206 150 188 154 C176 134 156 124 138 112 C122 128 96 156 72 176 Z" fill="url(#hair)"/>
  <path d="M104 96 C130 64 200 56 250 90 C210 76 150 80 104 96 Z" fill="url(#hairhi)"/>
  <!-- side locks -->
  <path d="M74 176 C62 220 66 270 80 306 C96 280 98 232 92 190 Z" fill="url(#hair)"/>
  <path d="M286 176 C298 220 294 270 280 306 C264 280 262 232 268 190 Z" fill="url(#hair)"/>

  <!-- eyes -->
  <g>
    <ellipse cx="138" cy="206" rx="25" ry="31" fill="#fff"/>
    <ellipse cx="138" cy="210" rx="21" ry="27" fill="url(#iris)"/>
    <ellipse cx="138" cy="213" rx="10" ry="14" fill="#0b2a4a"/>
    <circle cx="130" cy="199" r="7.5" fill="#fff"/><circle cx="147" cy="222" r="3.5" fill="#fff"/>
    <path d="M110 190 C120 172 154 172 164 190" fill="none" stroke="#12324a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g>
    <ellipse cx="222" cy="206" rx="25" ry="31" fill="#fff"/>
    <ellipse cx="222" cy="210" rx="21" ry="27" fill="url(#iris)"/>
    <ellipse cx="222" cy="213" rx="10" ry="14" fill="#0b2a4a"/>
    <circle cx="214" cy="199" r="7.5" fill="#fff"/><circle cx="231" cy="222" r="3.5" fill="#fff"/>
    <path d="M196 190 C206 172 240 172 250 190" fill="none" stroke="#12324a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- blush, nose, smile -->
  <ellipse cx="106" cy="246" rx="17" ry="9" fill="#ff8fb4" opacity=".5"/>
  <ellipse cx="254" cy="246" rx="17" ry="9" fill="#ff8fb4" opacity=".5"/>
  <path d="M180 240 l-3 6 h6 z" fill="#f0a890"/>
  <path d="M160 256 Q180 276 200 256 Q180 264 160 256 Z" fill="#c8405a" stroke="#8a2a40" stroke-width="2" stroke-linejoin="round"/>

  <!-- hair orbs (glossy clips) -->
  <circle cx="92" cy="104" r="22" fill="url(#orbg)" stroke="#fff" stroke-width="3"/>
  <ellipse cx="85" cy="94" rx="12" ry="7" fill="#fff" opacity=".8"/>
  <circle cx="270" cy="104" r="22" fill="url(#orbb)" stroke="#fff" stroke-width="3"/>
  <ellipse cx="263" cy="94" rx="12" ry="7" fill="#fff" opacity=".8"/>
  <!-- sprout on top -->
  <path d="M180 46 C180 28 186 18 198 12" fill="none" stroke="#2e9a2e" stroke-width="5" stroke-linecap="round"/>
  <path d="M198 12 C218 -2 244 6 248 24 C228 34 206 30 198 12 Z" fill="url(#shoe)"/>
  <path d="M180 40 C164 20 140 22 134 38 C152 50 172 48 180 40 Z" fill="url(#shoe)"/>
</svg>
