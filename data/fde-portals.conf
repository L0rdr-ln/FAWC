# xdg-desktop-portal configuration for the FDE desktop. Install as
#   ~/.config/xdg-desktop-portal/fde-portals.conf   (or /usr/share/xdg-desktop-portal/fde-portals.conf)
# Screen sharing and screenshots come from the wlr portal (it uses FDE's screen capture);
# file dialogs, settings and the rest from the GTK portal.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
