[package]
name = "fde-settings"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The FDE control panel: edits ~/.config/fde/fde.toml, which the running desktop applies at once"

[dependencies]
fde = { path = ".." }
gtk4 = { version = "0.9", features = ["v4_10"] }

[dev-dependencies]
tempfile = "3"
