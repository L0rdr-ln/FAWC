[package]
name = "fawc-settings"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The FAWC control panel: edits ~/.config/fawc/fawc.toml, which the running desktop applies at once"

[dependencies]
fawc = { path = ".." }
gtk4 = { version = "0.9", features = ["v4_10"] }

[dev-dependencies]
tempfile = "3"
