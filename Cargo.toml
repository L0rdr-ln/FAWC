[workspace]
members = ["settings", "music"]

[package]
name = "fawc"
version = "0.1.0"
edition = "2021"
default-run = "fawc"
license = "MIT"
description = "A Wayland compositor with real glass: blur, gloss and translucency drawn on the GPU"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "backend_gbm",
    "backend_drm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "renderer_gl",
    "desktop",
    "wayland_frontend",
] }
tracing = "0.1"
png = "0.17"
jpeg-decoder = "0.3"
image-webp = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cosmic-text = "0.19.0"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }
libc = "0.2"
xcursor = "0.3"
zbus = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
xkbcommon = "0.8"

[profile.release]
lto = "thin"

[dev-dependencies]
tempfile = "3"
jpeg-encoder = "0.6"
